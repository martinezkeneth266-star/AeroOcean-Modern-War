<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerra Sobre el Agua</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; color: #00FF00;
            font-family: monospace; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        #pantalla { text-align: center; padding: 20px; font-size: 1.2rem; }
        .subtexto { color: #888888; font-size: 0.9rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="pantalla" aria-hidden="true">
        <h1>GUERRA SOBRE EL AGUA</h1>
        <p id="estado-texto">Toca la pantalla para iniciar el motor de audio, música y navegación por voz.</p>
        <p class="subtexto">Navegación: Desliza Arriba/Abajo.<br>Seleccionar: Toca la pantalla.<br>Estado rápido: Desliza Horizontalmente.</p>
    </div>

    <script>
        // --- MOTOR DE AUDIO SINTETIZADO NATIVO (WEB AUDIO API 3D) ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let ctx = null;
        let musicaActiva = false;
        let intervaloMusica = null;

        function initAudio() {
            if (!ctx) {
                ctx = new AudioCtx();
                iniciarMusicaFondo();
            }
            if (ctx.state === 'suspended') ctx.resume();
        }

        // --- MÚSICA DE FONDO SINTETIZADA EN TIEMPO REAL ---
        function iniciarMusicaFondo() {
            if (musicaActiva) return;
            musicaActiva = true;

            // Secuencia de notas graves épicas (Frecuencias en Hz: La, Do, Re, Fa)
            const notas = [110, 130.81, 146.83, 174.61, 110, 130.81, 98, 110];
            let paso = 0;

            intervaloMusica = setInterval(() => {
                if (!ctx || ctx.state !== 'running') return;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notas[paso], ctx.currentTime);

                // Volumen suave para que no tape la voz ni los efectos de disparo
                gain.gain.setValueAtTime(0.03, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.8);

                paso = (paso + 1) % notas.length;
            }, 800); // Cambia de nota cada 800ms
        }

        function reproducirEfecto(tipo, pan = 0) {
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

            osc.connect(gain);
            if (panner) {
                panner.pan.value = pan; // -1 Izquierda, 0 Centro, 1 Derecha
                gain.connect(panner);
                panner.connect(ctx.destination);
            } else {
                gain.connect(ctx.destination);
            }

            const ahora = ctx.currentTime;

            if (tipo === 'menu') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, ahora);
                osc.frequency.exponentialRampToValueAtTime(880, ahora + 0.05);
                gain.gain.setValueAtTime(0.1, ahora);
                gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.05);
                osc.start(ahora);
                osc.stop(ahora + 0.05);
            } else if (tipo === 'disparo') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ahora);
                osc.frequency.linearRampToValueAtTime(30, ahora + 0.2);
                gain.gain.setValueAtTime(0.3, ahora);
                gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.2);
                osc.start(ahora);
                osc.stop(ahora + 0.2);
            } else if (tipo === 'alarma') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, ahora);
                osc.frequency.setValueAtTime(600, ahora + 0.1);
                gain.gain.setValueAtTime(0.2, ahora);
                gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.2);
                osc.start(ahora);
                osc.stop(ahora + 0.2);
            } else if (tipo === 'explosion') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, ahora);
                osc.frequency.exponentialRampToValueAtTime(20, ahora + 0.5);
                gain.gain.setValueAtTime(0.4, ahora);
                gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.5);
                osc.start(ahora);
                osc.stop(ahora + 0.5);
            }
        }

        function vibrar(patron) {
            if (navigator.vibrate) navigator.vibrate(patron);
        }

        // --- MOTOR DE SÍNTESIS DE VOZ PROPIO (NO DEPENDIENTE DE TALKBACK) ---
        const synth = window.speechSynthesis;
        function hablar(texto, prioridad = true) {
            document.getElementById('estado-texto').innerText = texto;
            if (prioridad && synth.speaking) synth.cancel();
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.0;
            synth.speak(mensaje);
        }

        // --- BASE DE DATOS Y ESTADO DEL JUEGO ---
        const juego = {
            etapa: 1,
            saludPortaaviones: 100,
            recursos: 1000,
            combustible: 500,
            municion: 300,
            flota: { cazas: 12, bombarderos: 6, destructores: 2 },
            mapa: [
                { id: 0, nombre: "Isla Alfa (Entrenamiento)", region: "Caribe", distancia: 100, defensas: 20, recursos: 200, conquistado: false },
                { id: 1, nombre: "Archipiélago del Sur", region: "Atlántico Norte", distancia: 450, defensas: 50, recursos: 500, conquistado: false },
                { id: 2, nombre: "Base Naval Potencia Alfa", region: "Pacífico", distancia: 1200, defensas: 85, recursos: 1200, conquistado: false },
                { id: 3, nombre: "Estrecho Estratégico", region: "Mediterráneo", distancia: 800, defensas: 65, recursos: 800, conquistado: false }
            ],
            territorioSeleccionado: 0,
            enCombate: false,
            saludEnemigo: 0,
            posicionEnemigoPan: 0
        };

        // --- SISTEMA DE MENÚS NATIVOS ---
        let menuActual = 'PRINCIPAL';
        let indiceMenu = 0;

        const menus = {
            PRINCIPAL: [
                "Campaña Mundial y Mapa",
                "Estado de la Flota",
                "Reconocer Objetivo",
                "Iniciar Combate Táctico",
                "Hangar y Gestión de Recursos",
                "Guardar Partida"
            ],
            MAPA: [],
            HANGAR: [
                "Reparar Portaaviones (100 recursos)",
                "Comprar Munición (50 recursos)",
                "Cargar Combustible (50 recursos)",
                "Construir Caza (200 recursos)",
                "Volver al Menú Principal"
            ]
        };

        function obtenerOpcionesMenu() {
            if (menuActual === 'MAPA') {
                return juego.mapa.map(t => `${t.nombre} - ${t.conquistado ? 'Conquistado' : 'Enemigo'}`);
            }
            return menus[menuActual];
        }

        function navegarMenu(direccion) {
            initAudio();
            const opciones = obtenerOpcionesMenu();
            indiceMenu += direccion;
            if (indiceMenu < 0) indiceMenu = opciones.length - 1;
            if (indiceMenu >= opciones.length) indiceMenu = 0;

            reproducirEfecto('menu');
            vibrar(30);
            hablar(opciones[indiceMenu]);
        }

        function seleccionarOpcion() {
            initAudio();
            reproducirEfecto('menu');
            vibrar([50, 50, 50]);

            if (juego.enCombate) {
                ejecutarAtaque();
                return;
            }

            if (menuActual === 'PRINCIPAL') {
                switch(indiceMenu) {
                    case 0:
                        menuActual = 'MAPA';
                        indiceMenu = 0;
                        hablar("Mapa Mundial. Selecciona un territorio.");
                        navegarMenu(0);
                        break;
                    case 1:
                        hablar(`Estado de la flota. Portaaviones al ${juego.saludPortaaviones} por ciento. Recursos ${juego.recursos}. Combustible ${juego.combustible}. Cazas ${juego.flota.cazas}. Bombarderos ${juego.flota.bombarderos}. Destructores ${juego.flota.destructores}.`);
                        break;
                    case 2:
                        const t = juego.mapa[juego.territorioSeleccionado];
                        hablar(`Objetivo actual: ${t.nombre}. Región ${t.region}. Distancia ${t.distancia} millas. Defensas ${t.defensas} por ciento. Estado: ${t.conquistado ? 'Bajo control' : 'Enemigo'}.`);
                        break;
                    case 3:
                        iniciarCombate();
                        break;
                    case 4:
                        menuActual = 'HANGAR';
                        indiceMenu = 0;
                        hablar("Hangar y gestión. Selecciona una acción.");
                        navegarMenu(0);
                        break;
                    case 5:
                        localStorage.setItem('guerra_agua_save', JSON.stringify(juego));
                        hablar("Partida guardada correctamente.");
                        break;
                }
            } else if (menuActual === 'MAPA') {
                juego.territorioSeleccionado = indiceMenu;
                const t = juego.mapa[indiceMenu];
                hablar(`Territorio ${t.nombre} seleccionado como objetivo principal.`);
                menuActual = 'PRINCIPAL';
                indiceMenu = 0;
            } else if (menuActual === 'HANGAR') {
                switch(indiceMenu) {
                    case 0:
                        if (juego.recursos >= 100 && juego.saludPortaaviones < 100) {
                            juego.recursos -= 100;
                            juego.saludPortaaviones = Math.min(100, juego.saludPortaaviones + 30);
                            hablar(`Reparación completada. Salud actual al ${juego.saludPortaaviones} por ciento.`);
                        } else hablar("Recursos insuficientes o salud al máximo.");
                        break;
                    case 1:
                        if (juego.recursos >= 50) {
                            juego.recursos -= 50; juego.municion += 100;
                            hablar(`Munición adquirida. Total: ${juego.municion}`);
                        } else hablar("Recursos insuficientes.");
                        break;
                    case 2:
                        if (juego.recursos >= 50) {
                            juego.recursos -= 50; juego.combustible += 200;
                            hablar(`Combustible cargado. Total: ${juego.combustible}`);
                        } else hablar("Recursos insuficientes.");
                        break;
                    case 3:
                        if (juego.recursos >= 200) {
                            juego.recursos -= 200; juego.flota.cazas += 1;
                            hablar(`Nuevo caza construido. Total cazas: ${juego.flota.cazas}`);
                        } else hablar("Recursos insuficientes.");
                        break;
                    case 4:
                        menuActual = 'PRINCIPAL'; indiceMenu = 0;
                        hablar("Regresando al menú principal.");
                        break;
                }
            }
        }

        // --- MOTOR DE COMBATE CON AUDIO DIRECCIONAL ---
        function iniciarCombate() {
            const t = juego.mapa[juego.territorioSeleccionado];
            if (t.conquistado) {
                hablar("Este territorio ya ha sido conquistado. Selecciona un objetivo enemigo en el mapa.");
                return;
            }
            if (juego.combustible < 50 || juego.municion < 20) {
                hablar("Suministros insuficientes. Carga combustible y munición en el hangar.");
                return;
            }

            juego.enCombate = true;
            juego.saludEnemigo = t.defensas * 2;
            juego.combustible -= 50;
            juego.posicionEnemigoPan = (Math.random() * 2) - 1;

            const lado = juego.posicionEnemigoPan < -0.3 ? "por la izquierda" : (juego.posicionEnemigoPan > 0.3 ? "por la derecha" : "al frente");
            reproducirEfecto('alarma', juego.posicionEnemigoPan);
            vibrar([100, 100, 100, 100]);
            hablar(`Alarma de combate. Detección de enemigo ${lado}. Toca la pantalla repetidamente para lanzar ráfagas de cazas.`);
        }

        function ejecutarAtaque() {
            if (juego.municion <= 0) {
                hablar("¡Sin munición! Abortando combate.");
                juego.enCombate = false;
                return;
            }

            juego.municion -= 10;
            const daño = Math.floor(Math.random() * 20) + 10;
            juego.saludEnemigo -= daño;

            reproducirEfecto('disparo', juego.posicionEnemigoPan);
            vibrar(40);

            if (Math.random() > 0.5) {
                const dañoEnemigo = Math.floor(Math.random() * 10);
                juego.saludPortaaviones -= dañoEnemigo;
                setTimeout(() => {
                    reproducirEfecto('explosion', 0);
                    vibrar(150);
                }, 150);
            }

            if (juego.saludEnemigo <= 0) {
                juego.enCombate = false;
                const t = juego.mapa[juego.territorioSeleccionado];
                t.conquistado = true;
                juego.recursos += t.recursos;
                
                reproducirEfecto('explosion', 0);
                vibrar([200, 100, 200]);
                hablar(`¡Objetivo destruido! ${t.nombre} ha sido conquistado. Ganaste ${t.recursos} recursos.`);
            } else if (juego.saludPortaaviones <= 0) {
                juego.enCombate = false;
                juego.saludPortaaviones = 100;
                hablar("El portaaviones ha sido destruido. Retirada de emergencia a la base.");
            } else {
                juego.posicionEnemigoPan = (Math.random() * 2) - 1;
                const lado = juego.posicionEnemigoPan < -0.3 ? "izquierda" : (juego.posicionEnemigoPan > 0.3 ? "derecha" : "centro");
                hablar(`Impacto realizado. Defensas enemigas al ${Math.max(0, juego.saludEnemigo)}. Enemigo moviéndose a la ${lado}.`, false);
            }
        }

        // --- SISTEMA DE GESTOS TÁCTILES ---
        let startY = 0;
        let startX = 0;
        let juegoIniciado = false;

        document.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            startX = e.touches[0].clientX;
            
            if (!juegoIniciado) {
                juegoIniciado = true;
                initAudio();
                
                const save = localStorage.getItem('guerra_agua_save');
                if (save) Object.assign(juego, JSON.parse(save));

                hablar("Bienvenido a Guerra Sobre el Agua. Música de fondo y sistemas de audio activados. Desliza hacia abajo para navegar por el menú.");
            }
        }, false);

        document.addEventListener('touchend', (e) => {
            if (!juegoIniciado) return;

            let endY = e.changedTouches[0].clientY;
            let endX = e.changedTouches[0].clientX;
            let diffY = endY - startY;
            let diffX = endX - startX;

            if (Math.abs(diffY) > Math.abs(diffX)) {
                if (diffY > 40) navegarMenu(1);
                else if (diffY < -40) navegarMenu(-1);
                else seleccionarOpcion();
            } else if (Math.abs(diffX) > 50) {
                hablar(`Reporte rápido: Salud ${juego.saludPortaaviones} por ciento. Recursos ${juego.recursos}. Munición ${juego.municion}. Combustible ${juego.combustible}.`);
            }
        }, false);
    </script>
</body>
</html>
