name: Compilar APK del Juego

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Cordova e instalar plugins de pantalla
        run: |
          npm install -g cordova

      - name: Crear proyecto Cordova, configurar orientación y compilar APK
        run: |
          cordova create temp_app com.guerra.sobreelagua "Guerra Sobre el Agua"
          cd temp_app
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          
          # Copiar config.xml del repositorio si existe
          if [ -f ../config.xml ]; then
            cp ../config.xml .
          fi

          # Añadir plataforma Android y plugin de orientación horizontal
          cordova platform add android
          cordova plugin add cordova-plugin-screen-orientation
          
          # Compilar APK
          cordova build android --release

      - name: Subir APK compilada como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AeroOcean-ModernWar-APK
          path: temp_app/platforms/android/app/build/outputs/apk/release/*.apk
