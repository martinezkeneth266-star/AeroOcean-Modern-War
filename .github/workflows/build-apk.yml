name: Compilar APK del Juego

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova
        run: |
          npm install -g cordova

      - name: Crear y preparar directorio de la app
        run: |
          cordova create app_temp com.guerra.sobreelagua "Guerra Sobre el Agua"

      - name: Copiar archivos del proyecto a Cordova
        run: |
          rm -rf app_temp/www/*
          find . -maxdepth 1 ! -name '.' ! -name 'app_temp' ! -name '.git' ! -name '.github' -exec cp -r {} app_temp/www/ \;

      - name: Compilar plataforma Android
        run: |
          cd app_temp
          if [ -f www/config.xml ]; then
            cp www/config.xml .
          fi
          cordova platform add android
          cordova plugin add cordova-plugin-screen-orientation
          cordova build android --debug

      - name: Subir APK compilada como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AeroOcean-ModernWar-APK
          path: app_temp/platforms/android/app/build/outputs/apk/debug/*.apk
