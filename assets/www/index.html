<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const $ = id => document.getElementById(id);

let battleActive = false;
let navegando = false;
let objetivoActual = null;
let vehiculoActual = null;
let armaActual = null;
let enemigoInterval = null;
let navegacionTimeout = null;

let estadoJuego = {

nivel:1,

dinero:500,

minerales:150,

combustible:100,

municion:100,

repuestos:20,

vida:100,

victorias:0,

misiones:0,

territorios:0

};


/* ============================================================
   GUARDADO
============================================================ */

function guardar(){

localStorage.setItem(
"AeroOceanModernWar",
JSON.stringify(estadoJuego)
);

}

function cargar(){

const datos =
localStorage.getItem("AeroOceanModernWar");

if(!datos){

return false;

}

try{

estadoJuego =
Object.assign(
estadoJuego,
JSON.parse(datos)
);

return true;

}catch(e){

return false;

}

}


/* ============================================================
   VIBRACIÓN
============================================================ */

function vibrar(tipo="normal"){

if(!navigator.vibrate) return;

if(tipo==="alerta"){

navigator.vibrate([150,80,150]);

}else if(tipo==="impacto"){

navigator.vibrate(120);

}else if(tipo==="victoria"){

navigator.vibrate([100,80,100,80,250]);

}else{

navigator.vibrate(60);

}

}


/* ============================================================
   AUDIO
============================================================ */

function reproducir(id, volumen=1){

const audio=$(id);

if(!audio) return;

try{

audio.pause();
audio.currentTime=0;
audio.volume=volumen;

audio.play().catch(()=>{});

}catch(e){}

}


/*
===============================================================
AMBIENTE PERMANENTE

El mar y el sonido del portaaviones NO se detienen durante
la batalla.
===============================================================
*/

function iniciarAmbiente(){

const mar=$("audioMar");

mar.loop=true;
mar.volume=0.45;

mar.play().catch(()=>{});


const porta=$("audioPortaaviones");

porta.loop=true;
porta.volume=0.25;

porta.play().catch(()=>{});

}


/*
===============================================================
MÚSICA DE FONDO

Solo se reproduce cuando NO existe una batalla.
===============================================================
*/

function iniciarMusicaFondo(){

if(battleActive) return;

const musica=$("audioBatalla");

musica.loop=true;
musica.volume=0.55;

musica.play().catch(()=>{});

}


/*
===============================================================
INICIO DE BATALLA

SOLO se pausa Batalla_Aeronaval.mp3.
===============================================================
*/

function iniciarBatallaAudio(){

battleActive=true;

$("audioBatalla").pause();

iniciarAmbiente();

reproducir("audioCombate",0.8);

}


/*
===============================================================
FIN DE BATALLA

El mar y portaaviones continúan.
La música de fondo vuelve.
===============================================================
*/

function terminarBatallaAudio(){

battleActive=false;

iniciarAmbiente();

iniciarMusicaFondo();

}


/* ============================================================
   REGISTRO
============================================================ */

function registrar(texto){

const log=$("log");

const linea=document.createElement("div");

linea.textContent=texto;

log.appendChild(linea);

log.scrollTop=log.scrollHeight;

}


/* ============================================================
   ESTADO
============================================================ */

function actualizarEstado(){

$("estado").textContent=

"Nivel: "+estadoJuego.nivel+
" | Dinero: $"+estadoJuego.dinero+
" | Minerales: "+estadoJuego.minerales+
" | Combustible: "+estadoJuego.combustible+"%"+
" | Munición: "+estadoJuego.municion+
" | Repuestos: "+estadoJuego.repuestos+
" | Vida: "+estadoJuego.vida+"%"+
" | Victorias: "+estadoJuego.victorias;

}


/* ============================================================
   OBJETIVOS
============================================================ */

const objetivos=[

{
id:"base",
nombre:"Base aérea enemiga",
tipo:"base",
defensa:45,
vida:100
},

{
id:"militar",
nombre:"Instalación militar estratégica",
tipo:"militar",
defensa:70,
vida:100
},

{
id:"naval",
nombre:"Grupo naval enemigo",
tipo:"naval",
defensa:60,
vida:100
},

{
id:"submarino",
nombre:"Submarino enemigo",
tipo:"submarino",
defensa:55,
vida:100
},

{
id:"costa",
nombre:"Instalación costera",
tipo:"costera",
defensa:65,
vida:100
}

];


function mostrarObjetivos(){

const contenedor=$("objetivos");

contenedor.innerHTML="";

objetivos.forEach(obj=>{

const boton=document.createElement("button");

boton.textContent=obj.nombre;

boton.setAttribute(
"aria-label",
"Objetivo: "+obj.nombre+
". Defensa: "+obj.defensa+" por ciento."
);

boton.onclick=()=>seleccionarObjetivo(obj);

contenedor.appendChild(boton);

});

}


/* ============================================================
   RECOMENDACIÓN DE VEHÍCULO
============================================================ */

function recomendarVehiculo(obj){

if(obj.tipo==="base"){

return "F-35";

}

if(obj.tipo==="militar"){

return "B-21 Raider";

}

if(obj.tipo==="naval"){

return "Destructor";

}

if(obj.tipo==="submarino"){

return "Destructor";

}

if(obj.tipo==="costera"){

return "B-21 Raider";

}

return "F-35";

}


/* ============================================================
   SELECCIONAR OBJETIVO
============================================================ */

function seleccionarObjetivo(obj){

if(battleActive || navegando){

return;

}

objetivoActual={
...obj
};

objetivoActual.vida=obj.vida;

reproducir(
"audioObjetivoIdentificado",
0.9
);

registrar(
"Objetivo identificado: "+obj.nombre
);

$("situacion").textContent=
"Objetivo identificado. Calculando vehículo recomendado.";

vibrar();

setTimeout(()=>{

const recomendado=
recomendarVehiculo(obj);

vehiculoActual=recomendado;

if(recomendado==="F-35"){

reproducir(
"audioRecomendadoF35",
1
);

}else if(recomendado==="B-21 Raider"){

reproducir(
"audioRecomendadoB21",
1
);

}else{

reproducir(
"audioRecomendadoDestructor",
1
);

}

registrar(
"Vehículo recomendado: "+recomendado
);

$("situacion").textContent=
"Vehículo recomendado: "+recomendado+
". Preparando despliegue.";

setTimeout(()=>desplegarVehiculo(),1200);

},1200);

}


/* ============================================================
   DESPLIEGUE
============================================================ */

function desplegarVehiculo(){

navegando=true;

$("panelArmas").classList.add("hidden");

if(vehiculoActual==="F-35"){

reproducir(
"audioF35Desplegado",
1
);

reproducir(
"audioF35Ruta",
0.8
);

reproducir(
"audioF35",
0.4
);

registrar(
"Vehículo F-35 desplegado."
);

$("situacion").textContent=
"F-35 en ruta hacia el objetivo.";

}else if(vehiculoActual==="B-21 Raider"){

reproducir(
"audioB21Desplegado",
1
);

reproducir(
"audioB21Ruta",
0.8
);

registrar(
"Bombardero B-21 Raider desplegado."
);

$("situacion").textContent=
"B-21 Raider en ruta hacia el objetivo.";

}else{

reproducir(
"audioDestructorDesplegado",
1
);

reproducir(
"audioDestructorRuta",
0.8
);

registrar(
"Destructor desplegado."
);

$("situacion").textContent=
"Destructor en ruta hacia el objetivo.";

}

const distancia =
9000 +
Math.floor(Math.random()*6000);

navegacionTimeout=setTimeout(()=>{

navegando=false;

reproducir(
"audioLlegada",
1
);

registrar(
"Vehículo ha llegado al área de combate."
);

$("situacion").textContent=
"Vehículo en el área de combate. Preparando combate.";

setTimeout(
prepararCombate,
1200
);

},distancia/10);

}


/* ============================================================
   PREPARAR COMBATE
============================================================ */

function prepararCombate(){

if(!objetivoActual) return;

iniciarBatallaAudio();

reproducir(
"audioEnemigo",
1
);

registrar(
"Enemigo detectado."
);

$("situacion").textContent=
"Enemigo detectado. Combate iniciado.";

mostrarArmas();

iniciarIAEnemiga();

}


/* ============================================================
   ARMAS
============================================================ */

function mostrarArmas(){

const panel=$("panelArmas");

const contenedor=$("armas");

contenedor.innerHTML="";

panel.classList.remove("hidden");

reproducir(
"audioSeleccionaArmamento",
0.8
);


if(vehiculoActual==="F-35"){

agregarArma(
"Misil de crucero",
"misilCrucero"
);

agregarArma(
"Ametralladora",
"ametralladora"
);

agregarArma(
"Misil aire-aire",
"misilAA"
);

}


if(vehiculoActual==="B-21 Raider"){

agregarArma(
"Bomba de precisión",
"bomba"
);

agregarArma(
"Bombardeo",
"bombardeo"
);

}


if(vehiculoActual==="Destructor"){

agregarArma(
"Misil",
"misil"
);

agregarArma(
"Cañón",
"canon"
);

agregarArma(
"Torpedo",
"torpedo"
);

}

}


/* ============================================================
   CREAR BOTÓN DE ARMA
============================================================ */

function agregarArma(nombre,tipo){

const boton=document.createElement("button");

boton.textContent=nombre;

boton.setAttribute(
"aria-label",
"Seleccionar arma: "+nombre
);

boton.onclick=()=>usarArma(tipo);

$("armas").appendChild(boton);

}


/* ============================================================
   COMBATE
============================================================ */

function usarArma(tipo){

if(!battleActive) return;

if(estadoJuego.municion<=0){

reproducir(
"audioMunicionBaja",
1
);

registrar(
"Munición agotada."
);

vibrar("alerta");

return;

}

armaActual=tipo;

let dano=0;

estadoJuego.municion--;

switch(tipo){

case"misilCrucero":

reproducir(
"audioMisilCruceroListo",
0.9
);

setTimeout(()=>{

reproducir(
"audioMisilCruceroLanzado",
1
);

reproducir(
"audioMisilCrucero",
0.7
);

aplicarDano(25);

},400);

break;


case"ametralladora":

reproducir(
"audioAmetralladoraSeleccionada",
0.9
);

setTimeout(()=>{

reproducir(
"audioAmetralladora",
0.8
);

reproducir(
"audioTrazadoras",
0.6
);

aplicarDano(10);

},250);

break;


case"misilAA":

reproducir(
"audioMisilAASeleccionado",
0.9
);

setTimeout(()=>{

reproducir(
"audioMisilAALanzado",
1
);

reproducir(
"audioMisil",
0.7
);

aplicarDano(20);

},350);

break;


case"bomba":

reproducir(
"audioBombaSeleccionada",
0.9
);

setTimeout(()=>{

reproducir(
"audioBombaLanzada",
1
);

reproducir(
"audioBomba",
0.8
);

reproducir(
"audioBombardeo",
0.7
);

aplicarDano(50);

},500);

break;


case"bombardeo":

reproducir(
"audioBombardeoAire",
0.8
);

setTimeout(()=>{

reproducir(
"audioBombardeo",
0.8
);

aplicarDano(40);

},500);

break;


case"misil":

reproducir(
"audioMisil",
0.8
);

setTimeout(()=>{

aplicarDano(30);

},400);

break;


case"canon":

reproducir(
"audioDisparo",
0.9
);

reproducir(
"audioTorreta",
0.5
);

setTimeout(()=>{

aplicarDano(15);

},250);

break;


case"torpedo":

reproducir(
"audioTorpedo",
1
);

setTimeout(()=>{

aplicarDano(35);

},500);

break;

}

actualizarEstado();

guardar();

}


/* ============================================================
   DAÑO AL ENEMIGO
============================================================ */

function aplicarDano(dano){

if(!battleActive) return;

objetivoActual.vida-=dano;

if(objetivoActual.vida<0){

objetivoActual.vida=0;

}

registrar(
"Daño causado al enemigo: "+
dano+" por ciento."
);

vibrar("impacto");

if(dano>=40){

reproducir(
"audioImpacto50",
0.8
);

}else{

reproducir(
"audioExplosion",
0.6
);

}

$("situacion").textContent=
"Objetivo: "+objetivoActual.nombre+
". Vida enemiga: "+
objetivoActual.vida+"%";

if(objetivoActual.vida<=0){

enemigoDestruido();

}

}


/* ============================================================
   IA ENEMIGA
============================================================ */

function iniciarIAEnemiga(){

detenerIAEnemiga();

enemigoInterval=setInterval(()=>{

if(!battleActive) return;

ataqueEnemigo();

},6000);

}


/* ============================================================
   ATAQUE ENEMIGO
============================================================ */

function ataqueEnemigo(){

if(!battleActive) return;

const dano =
5+
Math.floor(
Math.random()*11
);

estadoJuego.vida-=dano;

if(estadoJuego.vida<0){

estadoJuego.vida=0;

}

reproducir(
"audioAlarmaAtaque",
0.8
);

setTimeout(()=>{

if(vehiculoActual==="F-35"){

reproducir(
"audioAtencionF35",
1
);

}else{

reproducir(
"audioAlerta",
0.8
);

}

},400);

registrar(
"¡Alerta! Enemigo atacando."
);

registrar(
"Daño recibido: "+dano+" por ciento."
);

vibrar("alerta");

if(estadoJuego.vida<=25){

reproducir(
"audioEmergencia",
1
);

reproducir(
"audioAlarmaEmergencia",
0.8
);

}

actualizarEstado();

if(estadoJuego.vida<=0){

derrota();

}

}


/* ============================================================
   DETENER IA
============================================================ */

function detenerIAEnemiga(){

if(enemigoInterval){

clearInterval(enemigoInterval);

enemigoInterval=null;

}

}


/* ============================================================
   ENEMIGO DESTRUIDO
============================================================ */

function enemigoDestruido(){

detenerIAEnemiga();

reproducir(
"audioEnemigosDestruido",
1
);

registrar(
"Enemigo destruido."
);

$("situacion").textContent=
"Enemigo destruido.";

setTimeout(
objetivoDestruido,
1200
);

}


/* ============================================================
   OBJETIVO DESTRUIDO
============================================================ */

function objetivoDestruido(){

reproducir(
"audioObjetivoDestruido",
1
);

registrar(
"Objetivo destruido."
);

terminarBatallaAudio();

estadoJuego.victorias++;

estadoJuego.misiones++;

estadoJuego.dinero+=200;

estadoJuego.minerales+=50;

estadoJuego.combustible-=10;

if(estadoJuego.combustible<0){

estadoJuego.combustible=0;

}

estadoJuego.territorios++;

setTimeout(()=>{

reproducir(
"audioVictoria",
1
);

vibrar("victoria");

registrar(
"Victoria confirmada. Misión completada."
);

},1000);

setTimeout(()=>{

reproducir(
"audioMisionCompletada",
1
);

reproducir(
"audioRecursos",
1
);

},2500);

if(
estadoJuego.victorias % 3===0
){

estadoJuego.nivel++;

setTimeout(()=>{

reproducir(
"audioNivel",
1
);

registrar(
"Nivel aumentado."
);

},4000);

}

actualizarEstado();

guardar();

setTimeout(()=>{

prepararSiguienteMision();

},5500);

}


/* ============================================================
   SIGUIENTE MISIÓN
============================================================ */

function prepararSiguienteMision(){

reproducir(
"audioPreparando",
0.9
);

setTimeout(()=>{

reproducir(
"audioNuevaMision",
0.9
);

},1600);

$("situacion").textContent=
"Misión completada. Selecciona tu próximo objetivo.";

mostrarObjetivos();

}


/* ============================================================
   DERROTA
============================================================ */

function derrota(){

detenerIAEnemiga();

battleActive=false;

$("audioBatalla").pause();

reproducir(
"audioEmergencia",
1
);

registrar(
"Fuerzas destruidas. Misión perdida."
);

estadoJuego.nivel--;

if(estadoJuego.nivel<1){

estadoJuego.nivel=1;

}

estadoJuego.vida=100;

terminarBatallaAudio();

$("situacion").textContent=
"Has perdido la batalla. Tu nivel ha disminuido.";

actualizarEstado();

guardar();

}


/* ============================================================
   REABASTECIMIENTO
============================================================ */

function reabastecer(){

if(estadoJuego.dinero>=100){

estadoJuego.dinero-=100;

estadoJuego.combustible+=25;

if(estadoJuego.combustible>100){

estadoJuego.combustible=100;

}

}

if(estadoJuego.dinero>=150){

estadoJuego.dinero-=150;

estadoJuego.municion+=50;

}

if(estadoJuego.minerales>=50){

estadoJuego.minerales-=50;

estadoJuego.repuestos+=20;

}

reproducir(
"audioReabastecimiento",
1
);

actualizarEstado();

guardar();

}


/* ============================================================
   INICIO DE PARTIDA
============================================================ */

function comenzar(){

$("inicio").classList.add("hidden");

$("juego").classList.remove("hidden");

reproducir(
"audioInicio",
1
);

iniciarAmbiente();

setTimeout(()=>{

iniciarMusicaFondo();

},1500);

actualizarEstado();

mostrarObjetivos();

registrar(
"AeroOcean: Modern War iniciado."
);

registrar(
"El portaaviones navega por aguas internacionales."
);

registrar(
"Selecciona un objetivo cuando estés preparado."
);

}


/* ============================================================
   CONTINUAR
============================================================ */

function continuar(){

if(!cargar()){

alert(
"No existe una partida guardada."
);

return;

}

comenzar();

}


/* ============================================================
   BORRAR
============================================================ */

function borrarProgreso(){

localStorage.removeItem(
"AeroOceanModernWar"
);

estadoJuego={

nivel:1,

dinero:500,

minerales:150,

combustible:100,

municion:100,

repuestos:20,

vida:100,

victorias:0,

misiones:0,

territorios:0

};

alert(
"El progreso ha sido borrado."
);

}


/* ============================================================
   SALIR
============================================================ */

function salir(){

detenerIAEnemiga();

if(navegacionTimeout){

clearTimeout(
navegacionTimeout
);

}

battleActive=false;

$("audioBatalla").pause();

iniciarAmbiente();

iniciarMusicaFondo();

$("juego").classList.add("hidden");

$("inicio").classList.remove("hidden");

}


/* ============================================================
   EVENTOS
============================================================ */

$("btnComenzar").onclick=
comenzar;

$("btnContinuar").onclick=
continuar;

$("btnBorrar").onclick=
borrarProgreso;

$("btnGuardar").onclick=()=>{

guardar();

registrar(
"Progreso guardado."
);

vibrar();

};

$("btnSalir").onclick=
salir;


/* ============================================================
   INICIALIZACIÓN
============================================================ */

cargar();

actualizarEstado();

</script>

</body>
</html>
