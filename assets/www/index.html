<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AeroOcean: Modern War</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#06101b;
 color:#fff;
 font-family:Arial,sans-serif;
}

button{
 border:2px solid #526b82;
 border-radius:9px;
 background:#14283c;
 color:#fff;
 min-height:52px;
 padding:8px 12px;
 font-size:17px;
 font-weight:bold;
}

button:active{
 background:#315574;
}

.screen{
 width:100%;
 height:100%;
 overflow-y:auto;
 padding:10px;
}

.hidden{
 display:none!important;
}

.header{
 border:2px solid #3e586e;
 border-radius:10px;
 padding:9px;
 background:#0c1c2c;
}

.header h1{
 margin:0 0 7px;
 font-size:23px;
}

.statusGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
}

.statusBox{
 background:#071421;
 border:1px solid #40576b;
 border-radius:7px;
 padding:7px;
 min-height:46px;
}

.label{
 font-size:13px;
 color:#b8c8d6;
}

.value{
 font-size:17px;
 font-weight:bold;
}

.mainGrid{
 display:grid;
 grid-template-columns:1fr 1.5fr 1fr;
 gap:8px;
 margin-top:8px;
}

.panel{
 background:#0c1b2a;
 border:2px solid #3b5267;
 border-radius:10px;
 padding:9px;
}

.panel h2{
 margin:0 0 8px;
 font-size:19px;
}

.panel h3{
 margin:8px 0 5px;
 font-size:16px;
}

.info{
 line-height:1.5;
 font-size:16px;
}

.target{
 border:2px solid #8a7436;
 background:#19180d;
}

.enemy{
 border:2px solid #874545;
 background:#1b0d0d;
}

.controls{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
}

.controls button{
 min-height:48px;
 padding:5px;
}

.weaponGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:5px;
}

.weaponGrid button{
 min-height:55px;
}

.vehicleGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
}

.log{
 margin-top:8px;
 height:110px;
 overflow-y:auto;
 background:#030911;
 border:1px solid #42566a;
 border-radius:7px;
 padding:7px;
 font-size:15px;
 line-height:1.45;
}

.full{
 grid-column:1/-1;
}

.dangerText{
 color:#ffb0b0;
}

.goodText{
 color:#b5f0c3;
}

.center{
 text-align:center;
}

@media(max-width:800px){

 .mainGrid{
  grid-template-columns:1fr 1fr;
 }

 .fullMobile{
  grid-column:1/-1;
 }

}

@media(orientation:portrait){

 .mainGrid{
  grid-template-columns:1fr;
 }

 .statusGrid{
  grid-template-columns:repeat(2,1fr);
 }

}
</style>
</head>

<body>
