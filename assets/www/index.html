<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Conquista Global</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1e24;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #2c3e50;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #34495e;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.5rem;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
        }
        .stat-item {
            background: #34495e;
            padding: 6px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-value {
            font-weight: bold;
            color: #f1c40f;
        }
        #main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px);
        }
        #map-container {
            flex: 1;
            background-color: #0f171e;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        #map-container:active {
            cursor: grabbing;
        }
        #svg-map {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 0px 10px rgba(0,0,0,0.5));
        }
        .region {
            fill: #2b3e50;
            stroke: #1a252f;
            stroke-width: 1.5;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .region:hover {
            fill: #34495e;
            stroke: #3498db;
            stroke-width: 2.5;
        }
        .region.selected {
            fill: #e67e22 !important;
            stroke: #f39c12;
            stroke-width: 3;
        }
        .region.player-owned {
            fill: #27ae60;
        }
        .region.enemy-owned {
            fill: #c0392b;
        }
        .region-label {
            font-size: 11px;
            font-weight: bold;
            fill: #ffffff;
            pointer-events: none;
            text-anchor: middle;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
            user-select: none;
        }
        #sidebar {
            width: 320px;
            background-color: #2c3e50;
            border-left: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            box-shadow: -4px 0 6px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .panel-box {
            background-color: #1f2d3d;
            border: 1px solid #34495e;
            border-radius: 6px;
            padding: 15px;
        }
        .panel-title {
            font-size: 1.1rem;
            color: #3498db;
            margin-bottom: 10px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 5px;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        .btn:hover {
            background-color: #c0392b;
        }
        .btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #3498db;
        }
        .btn-secondary:hover {
            background-color: #2980b9;
        }
        #log-box {
            flex: 1;
            background-color: #151d24;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            overflow-y: auto;
            color: #bdc3c7;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
        }
        .log-entry {
            border-bottom: 1px dashed #2c3e50;
            padding-bottom: 4px;
        }
        .log-entry.combat { color: #e74c3c; }
        .log-entry.info { color: #3498db; }
        .log-entry.success { color: #2ecc71; }
    </style>
</head>
<body>

    <header>
        <h1>Conquista Global</h1>
        <div class="stats-bar">
            <div class="stat-item">Turno: <span id="turn-display" class="stat-value">1</span></div>
            <div class="stat-item">Tropas Disponibles: <span id="reserves-display" class="stat-value">5</span></div>
            <div class="stat-item">Territorios: <span id="territories-display" class="stat-value">0/6</span></div>
        </div>
    </header>

    <div id="main-container">
        <div id="map-container">
            <svg id="svg-map" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
                <path id="reg-na" class="region" d="M 150,80 L 320,70 L 380,140 L 300,260 L 220,280 L 120,200 Z" data-name="Norteamérica" />
                <path id="reg-sa" class="region" d="M 270,300 L 360,320 L 390,420 L 330,520 L 280,480 L 250,370 Z" data-name="Sudamérica" />
                <path id="reg-eu" class="region" d="M 450,90 L 580,80 L 620,160 L 540,230 L 440,200 L 430,140 Z" data-name="Europa" />
                <path id="reg-af" class="region" d="M 440,240 L 570,240 L 620,350 L 550,500 L 460,450 L 420,320 Z" data-name="África" />
                <path id="reg-as" class="region" d="M 600,70 L 900,60 L 950,220 L 820,330 L 650,280 L 590,170 Z" data-name="Asia" />
                <path id="reg-oc" class="region" d="M 780,380 L 900,370 L 940,480 L 850,540 L 760,470 Z" data-name="Oceanía" />

                <text x="240" y="170" class="region-label" id="label-na">Norteamérica (1)</text>
                <text x="310" y="410" class="region-label" id="label-sa">Sudamérica (1)</text>
                <text x="510" y="150" class="region-label" id="label-eu">Europa (1)</text>
                <text x="510" y="360" class="region-label" id="label-af">África (1)</text>
                <text x="750" y="180" class="region-label" id="label-as">Asia (1)</text>
                <text x="850" y="460" class="region-label" id="label-oc">Oceanía (1)</text>
            </svg>
        </div>

        <div id="sidebar">
            <div class="panel-box">
                <div class="panel-title">Territorio Seleccionado</div>
                <div id="selected-info">
                    <p><strong>Nombre:</strong> <span id="info-name">Ninguno</span></p>
                    <p><strong>Propietario:</strong> <span id="info-owner">-</span></p>
                    <p><strong>Tropas:</strong> <span id="info-troops">-</span></p>
                </div>
            </div>

            <div class="panel-box">
                <div class="panel-title">Acciones Tácticas</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button id="btn-deploy" class="btn btn-secondary" disabled>Desplegar Tropa</button>
                    <button id="btn-attack" class="btn" disabled>Atacar / Conquistar</button>
                    <button id="btn-end-turn" class="btn btn-secondary" style="background-color: #27ae60;">Finalizar Turno</button>
                </div>
            </div>

            <div class="panel-box" style="flex: 1; display: flex; flex-direction: column;">
                <div class="panel-title">Registro de Guerra</div>
                <div id="log-box">
                    <div class="log-entry info">¡Bienvenido a Conquista Global!</div>
                    <div class="log-entry info">Selecciona un territorio para comenzar.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameState = {
            turn: 1,
            reserves: 5,
            selectedRegionId: null,
            regions: {
                'reg-na': { name: 'Norteamérica', owner: 'Jugador 1', troops: 3, labelId: 'label-na' },
                'reg-sa': { name: 'Sudamérica', owner: 'Neutro', troops: 2, labelId: 'label-sa' },
                'reg-eu': { name: 'Europa', owner: 'Enemigo', troops: 3, labelId: 'label-eu' },
                'reg-af': { name: 'África', owner: 'Neutro', troops: 2, labelId: 'label-af' },
                'reg-as': { name: 'Asia', owner: 'Enemigo', troops: 4, labelId: 'label-as' },
                'reg-oc': { name: 'Oceanía', owner: 'Neutro', troops: 1, labelId: 'label-oc' }
            }
        };

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        const turnDisplay = document.getElementById('turn-display');
        const reservesDisplay = document.getElementById('reserves-display');
        const territoriesDisplay = document.getElementById('territories-display');
        const infoName = document.getElementById('info-name');
        const infoOwner = document.getElementById('info-owner');
        const infoTroops = document.getElementById('info-troops');
        const btnDeploy = document.getElementById('btn-deploy');
        const btnAttack = document.getElementById('btn-attack');
        const btnEndTurn = document.getElementById('btn-end-turn');
        const logBox = document.getElementById('log-box');

        function initGame() {
            updateVisuals();
            
            document.querySelectorAll('.region').forEach(regionEl => {
                regionEl.addEventListener('click', () => selectRegion(regionEl.id));
            });

            btnDeploy.addEventListener('click', handleDeploy);
            btnAttack.addEventListener('click', handleAttack);
            btnEndTurn.addEventListener('click', handleEndTurn);
        }

        function updateVisuals() {
            let playerTerritories = 0;
            const totalTerritories = Object.keys(gameState.regions).length;

            for (const [id, data] of Object.entries(gameState.regions)) {
                const el = document.getElementById(id);
                const labelEl = document.getElementById(data.labelId);

                el.classList.remove('player-owned', 'enemy-owned');
                if (data.owner === 'Jugador 1') {
                    el.classList.add('player-owned');
                    playerTerritories++;
                } else if (data.owner === 'Enemigo') {
                    el.classList.add('enemy-owned');
                }

                labelEl.textContent = `${data.name} (${data.troops})`;
            }

            turnDisplay.textContent = gameState.turn;
            reservesDisplay.textContent = gameState.reserves;
            territoriesDisplay.textContent = `${playerTerritories}/${totalTerritories}`;

            if (gameState.selectedRegionId) {
                const reg = gameState.regions[gameState.selectedRegionId];
                infoName.textContent = reg.name;
                infoOwner.textContent = reg.owner;
                infoTroops.textContent = reg.troops;

                btnDeploy.disabled = (reg.owner !== 'Jugador 1' || gameState.reserves <= 0);
                btnAttack.disabled = (reg.owner !== 'Jugador 1' || reg.troops <= 1);
            } else {
                infoName.textContent = 'Ninguno';
                infoOwner.textContent = '-';
                infoTroops.textContent = '-';
                btnDeploy.disabled = true;
                btnAttack.disabled = true;
            }
        }

        function selectRegion(id) {
            document.querySelectorAll('.region').forEach(el => el.classList.remove('selected'));
            
            if (gameState.selectedRegionId === id) {
                gameState.selectedRegionId = null;
            } else {
                gameState.selectedRegionId = id;
                document.getElementById(id).classList.add('selected');
                const reg = gameState.regions[id];
                speak(`${reg.name}. Controlado por ${reg.owner}. ${reg.troops} tropas.`);
            }

            updateVisuals();
        }

        function handleDeploy() {
            if (!gameState.selectedRegionId || gameState.reserves <= 0) return;

            const reg = gameState.regions[gameState.selectedRegionId];
            if (reg.owner === 'Jugador 1') {
                reg.troops++;
                gameState.reserves--;
                logMessage(`Desplegada 1 tropa en ${reg.name}.`, 'success');
                speak(`Tropa desplegada en ${reg.name}`);
                updateVisuals();
            }
        }

        function handleAttack() {
            if (!gameState.selectedRegionId) return;

            const attacker = gameState.regions[gameState.selectedRegionId];
            if (attacker.owner !== 'Jugador 1' || attacker.troops <= 1) {
                logMessage('Necesitas más de 1 tropa para atacar.', 'combat');
                return;
            }

            const enemyIds = Object.keys(gameState.regions).filter(id => gameState.regions[id].owner !== 'Jugador 1');
            if (enemyIds.length === 0) {
                logMessage('¡Has dominado todo el mapa!', 'success');
                speak('¡Felicidades! Has dominado todo el mundo.');
                return;
            }

            const targetId = enemyIds[Math.floor(Math.random() * enemyIds.length)];
            const defender = gameState.regions[targetId];

            logMessage(`Atacando ${defender.name} desde ${attacker.name}...`, 'combat');
            speak(`Atacando ${defender.name}`);

            const attackRoll = Math.floor(Math.random() * 6) + 1 + Math.floor(attacker.troops / 2);
            const defenseRoll = Math.floor(Math.random() * 6) + 1 + Math.floor(defender.troops / 2);

            if (attackRoll > defenseRoll) {
                defender.troops--;
                if (defender.troops <= 0) {
                    defender.owner = 'Jugador 1';
                    defender.troops = Math.floor(attacker.troops / 2);
                    attacker.troops -= defender.troops;
                    logMessage(`¡Victoria! Has conquistado ${defender.name}.`, 'success');
                    speak(`¡Victoria! Has conquistado ${defender.name}.`);
                } else {
                    logMessage(`Ataque con éxito. ${defender.name} pierde 1 tropa.`, 'success');
                }
            } else {
                attacker.troops--;
                logMessage(`El ataque falló. Perdiste 1 tropa en ${attacker.name}.`, 'combat');
                speak(`El ataque a ${defender.name} falló.`);
            }

            updateVisuals();
        }

        function handleEndTurn() {
            gameState.turn++;
            gameState.reserves += 3;
            
            const enemyIds = Object.keys(gameState.regions).filter(id => gameState.regions[id].owner === 'Enemigo');
            enemyIds.forEach(id => {
                gameState.regions[id].troops += 1;
            });

            logMessage(`--- Turno ${gameState.turn} iniciado ---`, 'info');
            logMessage('Recibes +3 tropas de refuerzo.', 'info');
            speak(`Turno ${gameState.turn}. Recibes 3 tropas de refuerzo.`);

            updateVisuals();
        }

        function logMessage(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString().slice(0,5)}] ${msg}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        window.onload = initGame;
    </script>
</body>
</html>
