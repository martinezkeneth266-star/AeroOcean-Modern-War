<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerra Sobre el Agua</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; color: #00FF00;
            font-family: monospace; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        #pantalla { text-align: center; padding: 20px; font-size: 1.2rem; }
        .subtexto { color: #888888; font-size: 0.9rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="pantalla" aria-hidden="true">
        <h1>GUERRA SOBRE EL AGUA</h1>
        <p id="estado-texto">Toca la pantalla para activar sistemas.</p>
        <p class="subtexto">Navegación: Desliza Arriba/Abajo.<br>Seleccionar: Toca la pantalla.<br>Estado rápido: Desliza Horizontalmente.</p>
    </div>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let ctx = null;
        
        function initAudio() {
            if (!ctx) ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
        }

        function reproducirEfecto(tipo, pan = 0) {
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
            osc.connect(gain);
            if (panner) { panner.pan.value = pan; gain.connect(panner); panner.connect(ctx.destination); } 
            else { gain.connect(ctx.destination); }
            const ahora = ctx.currentTime;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ahora);
            osc.frequency.exponentialRampToValueAtTime(880, ahora + 0.05);
            gain.gain.setValueAtTime(0.1, ahora);
            gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.05);
            osc.start(ahora); osc.stop(ahora + 0.05);
        }

        function hablar(texto) {
            document.getElementById('estado-texto').innerText = texto;
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            window.speechSynthesis.speak(mensaje);
        }

        let juegoIniciado = false;
        let startY = 0, startX = 0;

        document.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            startX = e.touches[0].clientX;

            // BLOQUEO DE ORIENTACIÓN Y FULLSCREEN
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(e => console.log(e));
            }

            if (!juegoIniciado) {
                juegoIniciado = true;
                initAudio();
                hablar("Bienvenido a Guerra Sobre el Agua. Sistema activado.");
            }
        }, false);

        document.addEventListener('touchend', (e) => {
            let endY = e.changedTouches[0].clientY;
            let diffY = endY - startY;
            if (Math.abs(diffY) > 50) {
                reproducirEfecto('menu');
                hablar(diffY > 0 ? "Navegando hacia abajo" : "Navegando hacia arriba");
            }
        }, false);
    </script>
</body>
</html>
