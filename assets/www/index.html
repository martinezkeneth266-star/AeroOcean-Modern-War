<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guerra Aérea Accesible</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #pantalla-juego {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="pantalla-juego" aria-hidden="true">
        <h1>Guerra Aérea Accesible</h1>
        <p>Toca la pantalla para comenzar</p>
    </div>

    <script>
        // Sistema de Voz Propio (TTS Nativo del juego)
        const voz = window.speechSynthesis;

        function hablar(texto) {
            if (voz.speaking) voz.cancel();
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.0;
            voz.speak(mensaje);
        }

        // Sistema de Audios del Juego
        const sonidos = {
            alarma: new Audio('alarma.mp3'),
            disparo: new Audio('disparo.mp3')
        };

        function reproducirSonido(nombre) {
            if (sonidos[nombre]) {
                sonidos[nombre].currentTime = 0;
                sonidos[nombre].play().catch(() => {});
            }
        }

        // Estructura del Menú Principal
        const menu = [
            "Iniciar Batalla Aérea",
            "Estado de la Flota",
            "Seleccionar Objetivo",
            "Lanzar Ataque",
            "Reparar Base"
        ];

        let opcionActual = 0;
        let juegoIniciado = false;

        // Navegación por Gestos Nativa
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            
            // Primer toque para iniciar el motor de audio
            if (!juegoIniciado) {
                juegoIniciado = true;
                reproducirSonido('alarma');
                hablar("Bienvenido a Guerra Aérea Accesible. Desliza hacia abajo o arriba para navegar. Toca dos veces para seleccionar.");
            }
        }, false);

        document.addEventListener('touchend', (e) => {
            if (!juegoIniciado) return;

            let touchEndY = e.changedTouches[0].clientY;
            let diferenciaY = touchEndY - touchStartY;

            // Deslizar hacia abajo -> Siguiente opción
            if (diferenciaY > 40) {
                opcionActual = (opcionActual + 1) % menu.length;
                hablar(menu[opcionActual]);
            } 
            // Deslizar hacia arriba -> Opción anterior
            else if (diferenciaY < -40) {
                opcionActual = (opcionActual - 1 + menu.length) % menu.length;
                hablar(menu[opcionActual]);
            } 
            // Tocar en pantalla -> Ejecutar opción
            else if (Math.abs(diferenciaY) < 10) {
                ejecutarAccion(opcionActual);
            }
        }, false);

        // Lógica de Acciones del Juego
        function ejecutarAccion(opcion) {
            switch(opcion) {
                case 0:
                    hablar("Iniciando Batalla Aérea. Radares activados.");
                    reproducirSonido('alarma');
                    break;
                case 1:
                    hablar("Estado de la flota: Salud al 100 por ciento. Todos los aviones listos.");
                    break;
                case 2:
                    hablar("Objetivo detectado: Caza enemigo a 2000 metros.");
                    break;
                case 3:
                    hablar("Fuego cruzado iniciado.");
                    reproducirSonido('disparo');
                    break;
                case 4:
                    hablar("Reparando aeronaves en el hangar.");
                    break;
            }
        }
    </script>
</body>
</html>
