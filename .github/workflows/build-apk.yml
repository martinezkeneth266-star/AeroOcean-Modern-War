name: Compilar APK del Juego

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear proyecto Cordova
        run: cordova create app_temp com.guerra.sobreelagua "Guerra Sobre el Agua"

      - name: Copiar archivos al sitio correcto
        run: |
          rm -rf app_temp/www/*
          cp -r index.html js css audio img assets app_temp/www/ 2>/dev/null || cp -r * app_temp/www/ 2>/dev/null || true
          if [ -f config.xml ]; then cp config.xml app_temp/; fi

      - name: Compilar APK
        run: |
          cd app_temp
          cordova platform add android
          cordova plugin add cordova-plugin-screen-orientation
          cordova build android --debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroOcean-ModernWar-APK
          path: app_temp/platforms/android/app/build/outputs/apk/debug/*.apk
