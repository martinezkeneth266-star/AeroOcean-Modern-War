name: Compilar APK AeroOcean Modern War

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Configurar Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova
        run: |
          npm install -g cordova

      - name: Crear proyecto Cordova
        run: |
          cordova create temp_app com.guerra.sobreelagua "AeroOcean: Modern War"

      - name: Copiar archivos del juego
        run: |
          rm -rf temp_app/www/*
          cp -r activos/www/* temp_app/www/

      - name: Agregar Android
        run: |
          cd temp_app
          cordova platform add android

      - name: Configurar orientación horizontal
        run: |
          cd temp_app
          python3 - <<'PY'
          from pathlib import Path

          archivo = Path("config.xml")
          texto = archivo.read_text()

          if 'name="Orientation"' not in texto:
              texto = texto.replace(
                  "</widget>",
                  '    <preference name="Orientation" value="landscape" />\n</widget>'
              )

          archivo.write_text(texto)
          PY

      - name: Compilar APK
        run: |
          cd temp_app
          cordova build android --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroOcean-Modern-War
          path: temp_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
