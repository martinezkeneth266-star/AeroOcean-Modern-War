<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AeroOcean: Modern War</title>

<style>
*{
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#06131f;
color:#fff;
font-family:Arial,sans-serif;
}

button,input{
font-size:18px;
}

button{
display:block;
width:100%;
min-height:54px;
margin:7px 0;
padding:12px;
border:2px solid #4f91b5;
border-radius:10px;
background:#12364d;
color:white;
font-weight:bold;
}

button:focus,
input:focus{
outline:4px solid white;
}

input{
width:100%;
min-height:52px;
margin:6px 0;
padding:10px;
border-radius:8px;
border:2px solid #4f91b5;
background:#fff;
color:#000;
}

.pantalla{
width:100%;
height:100%;
overflow:auto;
padding:14px;
}

.panel{
background:#0b2536;
border:2px solid #28556d;
border-radius:14px;
padding:14px;
margin-bottom:12px;
}

.titulo{
font-size:32px;
font-weight:bold;
text-align:center;
margin:10px 0 18px;
}

.subtitulo{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.estado{
font-size:18px;
line-height:1.7;
}

.log{
height:150px;
overflow:auto;
background:#02090e;
border:2px solid #31586c;
border-radius:10px;
padding:10px;
font-size:17px;
line-height:1.6;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.grid button{
margin:0;
}

.arma{
background:#173f58;
}

.movimiento{
background:#174d4d;
}

.alerta{
background:#4b211d;
}

.exito{
background:#15492a;
}

.oculto{
display:none!important;
}

.dato{
font-size:20px;
font-weight:bold;
}

@media (orientation:portrait){
body:before{
content:"Gira el dispositivo a posición horizontal para jugar.";
position:fixed;
z-index:99999;
inset:0;
background:#06131f;
color:white;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
font-size:25px;
font-weight:bold;
}
}
</style>
</head>
