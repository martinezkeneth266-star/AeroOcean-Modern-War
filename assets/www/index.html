<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerra Aérea Accesible - AeroOcean</title>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --panel-bg: #1b263b;
            --accent-color: #00b4d8;
            --text-color: #e0e1dd;
            --danger-color: #e63946;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-color); }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }

        .module {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .module h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 5px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 15px;
            margin: 5px 2px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover, button:focus {
            background-color: #90e0ef;
            outline: 3px solid #fff;
        }

        button.danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        .status-box {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>AeroOcean: Modern War</h1>
    <p>Centro de Mando Aeronaval Accesible</p>

    <div class="dashboard">
        <!-- Módulo 1: Ambientación y Navegación -->
        <section class="module" aria-labelledby="mod-ambient">
            <h2 id="mod-ambient">1. Ambiente y Propulsión</h2>
            <button onclick="SoundEngine.toggleSea()" aria-label="Iniciar o detener ambiente de mar">Ambiente: Mar</button>
            <button onclick="SoundEngine.toggleBattleMusic()" aria-label="Iniciar o detener música de batalla">Música de Batalla</button>
            <button onclick="SoundEngine.playFX('sonidodeportaaviones.mp3', 'Portaaviones activo')">Activar Portaaviones</button>
            <button onclick="SoundEngine.playFX('Sonido De Avion.mp3', 'Avión en vuelo')">Sonido de Avión</button>
            <button onclick="SoundEngine.playFX('sonidode-f-35.mp3', 'F-35 desplegado')">Desplegar F-35</button>
            <button onclick="SoundEngine.playFX('aterrizaje.mp3', 'Maniobra de aterrizaje')">Aterrizaje</button>
        </section>

        <!-- Módulo 2: Detección y Alarmas -->
        <section class="module" aria-labelledby="mod-radar">
            <h2 id="mod-radar">2. Radar y Alarmas</h2>
            <button onclick="SoundEngine.playFX('contactoderadar.mp3', 'Contacto de radar detectado')">Contacto de Radar</button>
            <button onclick="SoundEngine.playFX('alerta.mp3', 'Alerta en sistema')">Alerta Sonora</button>
            <button class="danger" onclick="SoundEngine.playFX('Alarma de emergencia.mp3', 'Alarma de emergencia activada')">Alarma de Emergencia</button>
            <button class="danger" onclick="SoundEngine.playFX('Alarmadeataqueenemigo.mp3', 'Alerta de ataque enemigo')">Alarma Ataque Enemigo</button>
        </section>

        <!-- Módulo 3: Armamento Táctico -->
        <section class="module" aria-labelledby="mod-combat">
            <h2 id="mod-combat">3. Control de Armamento</h2>
            <button class="danger" onclick="SoundEngine.playFX('Ametralladora.mp3', 'Fuego de ametralladora')">Ametralladora</button>
            <button class="danger" onclick="SoundEngine.playFX('mp40.mp3', 'Fuego de MP40')">Fuego MP40</button>
            <button class="danger" onclick="SoundEngine.playFX('misil.mp3', 'Lanzamiento de misil')">Lanzar Misil</button>
            <button class="danger" onclick="SoundEngine.playFX('misil de crucero.mp3', 'Misil de crucero lanzado')">Misil de Crucero</button>
            <button class="danger" onclick="SoundEngine.playFX('bonba.mp3', 'Bomba desplegada')">Desplegar Bomba</button>
            <button class="danger" onclick="SoundEngine.playFX('Defensa antiaérea.mp3', 'Defensa antiaérea activa')">Defensa Antiaérea</button>
        </section>
    </div>

    <!-- Módulo 4: Consola de Estado -->
    <div style="width: 100%; max-width: 900px; margin-top: 20px;">
        <h2>Estado del Sistema</h2>
        <div id="statusLog" class="status-box" role="log" aria-live="polite">
            Esperando órdenes del comandante...
        </div>
    </div>

    <script>
        // Los audios están en la misma carpeta que index.html
        const AUDIO_FOLDER = '';

        const SoundEngine = {
            seaAudio: null,
            battleAudio: null,

            speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-ES';
                    window.speechSynthesis.speak(utterance);
                }
                const log = document.getElementById('statusLog');
                log.innerHTML += `<div>> ${text}</div>`;
                log.scrollTop = log.scrollHeight;
            },

            playFX(fileName, description) {
                const audio = new Audio(AUDIO_FOLDER + fileName);
                audio.play().catch(e => {
                    console.error(`Error al cargar ${fileName}:`, e);
                    this.speak(`Error cargando archivo ${fileName}`);
                });
                if (description) {
                    this.speak(description);
                }
            },

            toggleSea() {
                if (!this.seaAudio) {
                    this.seaAudio = new Audio(AUDIO_FOLDER + 'mar.mp3');
                    this.seaAudio.loop = true;
                }

                if (this.seaAudio.paused) {
                    this.seaAudio.play().catch(e => console.error(e));
                    this.speak("Ambiente de mar activado.");
                } else {
                    this.seaAudio.pause();
                    this.speak("Ambiente de mar pausado.");
                }
            },

            toggleBattleMusic() {
                if (!this.battleAudio) {
                    this.battleAudio = new Audio(AUDIO_FOLDER + 'Batalla_Aeronaval.mp3');
                    this.battleAudio.loop = true;
                }

                if (this.battleAudio.paused) {
                    this.battleAudio.play().catch(e => console.error(e));
                    this.speak("Música de batalla activada.");
                } else {
                    this.battleAudio.pause();
                    this.speak("Música de batalla pausada.");
                }
            }
        };

        window.addEventListener('load', () => {
            setTimeout(() => {
                SoundEngine.playFX('mensajedebienvenida.mp3', 'Sistemas listos. Bienvenido comandante.');
            }, 500);
        });
    </script>
</body>
</html>
