<style>
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505; color: #fff; font-family: monospace; overflow: hidden; }

#app { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }

/* PANEL DE CONTROL SUPERIOR */
#topBar {
  background: #0a1118;
  border-bottom: 2px solid #00ffcc;
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  z-index: 10;
}
.res-item { display: flex; align-items: center; gap: 4px; }
.res-val { color: #00ffcc; font-weight: bold; }

/* VISTA PRINCIPAL DEL JUEGO */
#gameView { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 8px; position: absolute; top: 0; left: 0; z-index: 1; margin-top: 40px; }
#status { border: 2px solid #00ffcc; background: #111; padding: 10px; font-size: 14px; border-radius: 6px; text-align: center; margin-bottom: 6px; color: #00ffcc; }
#canvasContainer { flex: 1; background: #020b14; border: 2px solid #00ffcc; border-radius: 8px; display: flex; justify-content: center; align-items: center; position: relative; }

button { background: #161616; color: #00ffcc; border: 2px solid #00ffcc; border-radius: 6px; padding: 12px 6px; font: inherit; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
button:active, button:focus { background: #00ffcc; color: #000; outline: none; }

/* VISTA DE MENÚ A PANTALLA COMPLETA (MAPA MUNDIAL) */
.full-screen-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #080e14; z-index: 100; display: none; flex-direction: column; padding: 16px; overflow-y: auto; }
.menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ffcc; padding-bottom: 10px; margin-bottom: 15px; }
.menu-header h2 { margin: 0; color: #00ffcc; font-size: 18px; }

/* LISTA DE NAVEGACIÓN DEL MAPA */
.breadcrumb { color: #ffaa00; font-size: 12px; margin-bottom: 12px; font-weight: bold; }
.map-list { display: flex; flex-direction: column; gap: 8px; }
.map-card { background: #112233; border: 1px solid #00ffcc; border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
.map-card-info { display: flex; flex-direction: column; gap: 4px; }
.reward-tag { color: #ffaa00; font-size: 11px; }

.btn-back { border-color: #ffaa00; color: #ffaa00; margin-bottom: 10px; }
.btn-close { border-color: #ff5555; color: #ff5555; padding: 6px 12px; }
</style>
</head>

<div id="app">

<!-- BARRA DE RECURSOS DEL JUGADOR -->
<div id="topBar">

let currentLevel = 'continents';
let selectedContinent = null;
let selectedRegion = null;

function hablar(texto) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-ES';
    window.speechSynthesis.speak(utterance);
  }
}

function abrirMapa() {
  document.getElementById('gameView').style.display = 'none';
  document.getElementById('mapMenu').style.display = 'flex';
  mostrarContinentes();
  hablar("Mapa mundial abierto. Selecciona un continente.");
}

function cerrarMapa() {
  document.getElementById('mapMenu').style.display = 'none';
  document.getElementById('gameView').style.display = 'flex';
  hablar("De regreso al puesto de mando.");
}

function mostrarContinentes() {
  currentLevel = 'continents';
  selectedContinent = null;
  selectedRegion = null;

  document.getElementById('mapTitle').textContent = "🌍 CONTINENTES";
  document.getElementById('breadcrumb').textContent = "Ubicación: Continentes Habitados";
  document.getElementById('btnMapBack').style.display = "none";

  const mapList = document.getElementById('mapList');
  mapList.innerHTML = "";

  Object.keys(worldData).forEach(continente => {
    const btn = document.createElement('button');
    btn.className = "map-card";
    btn.setAttribute('aria-label', `Continente ${continente}`);
    btn.innerHTML = `<span><strong>${continente}</strong></span><span>Explorar ➔</span>`;
    btn.onclick = () => seleccionarContinente(continente);
    mapList.appendChild(btn);
  });
}

function seleccionarContinente(continente) {
  currentLevel = 'regions';
  selectedContinent = continente;

  document.getElementById('mapTitle').textContent = `🌍 ${continente.toUpperCase()}`;
  document.getElementById('breadcrumb').textContent = `Ubicación: Continente ${continente} > Regiones`;
  document.getElementById('btnMapBack').style.display = "block";

  const mapList = document.getElementById('mapList');
  mapList.innerHTML = "";

  const regiones = Object.keys(worldData[continente]);
  regiones.forEach(region => {
    const btn = document.createElement('button');
    btn.className = "map-card";
    btn.setAttribute('aria-label', `Región ${region}`);
    btn.innerHTML = `<span><strong>${region}</strong></span><span>Ver Territorios ➔</span>`;
    btn.onclick = () => seleccionarRegion(region);
    mapList.appendChild(btn);
  });

  hablar(`Continente ${continente} seleccionado. Selecciona una región.`);
}

function seleccionarRegion(region) {
  currentLevel = 'territories';
  selectedRegion = region;

  document.getElementById('mapTitle').textContent = `📍 ${region.toUpperCase()}`;
  document.getElementById('breadcrumb').textContent = `Ubicación: ${selectedContinent} > ${region}`;

  const mapList = document.getElementById('mapList');
  mapList.innerHTML = "";

  const territorios = worldData[selectedContinent][region];
  territorios.forEach(terr => {
    const btn = document.createElement('button');
    btn.className = "map-card";

    const labelTexto = `${terr.tipo}: ${terr.nombre}. Recompensa: ${terr.dinero} dólares y ${terr.minerales} minerales. Presiona para atacar.`;
    btn.setAttribute('aria-label', labelTexto);

    btn.innerHTML = `
      <div class="map-card-info">
        <strong>${terr.nombre} (${terr.tipo})</strong>
        <span class="reward-tag">Recompensa: $${terr.dinero} | 💎 ${terr.minerales}</span>
      </div>
      <span style="color:#00ffcc;">Atacar 🎯</span>`;
    btn.onclick = () => atacarTerritorio(terr);
    mapList.appendChild(btn);
  });

  hablar(`Región ${region}. Mostrando todos los países, archipiélagos e islas.`);
}

function retrocederNivel() {
  if (currentLevel === 'territories') {
    seleccionarContinente(selectedContinent);
  } else if (currentLevel === 'regions') {
    mostrarContinentes();
    hablar("Regresando a la lista de continentes.");
  }
}

function atacarTerritorio(territorio) {
  const mensaje = `Iniciando despliegue militar hacia ${territorio.nombre}. Recompensa por victoria: $${territorio.dinero} dólares y ${territorio.minerales} minerales.`;
  hablar(mensaje);
  alert(`🎯 ${mensaje}`);
  
  // Actualización de estado en UI
  document.getElementById('status').textContent = `Misión en progreso: Ataque a ${territorio.nombre}`;
  cerrarMapa();
}
</script>
