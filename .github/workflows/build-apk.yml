name: Compilar APK del Juego

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear proyecto y copiar assets
        run: |
          cordova create app_temp com.guerra.sobreelagua "Guerra Sobre el Agua"
          rm -rf app_temp/www/*
          
          # Ubica la carpeta que contenga index.html y copia sus archivos a app_temp/www
          INDEX_DIR=$(dirname $(find . -maxdepth 4 -iname "index.html" | head -n 1))
          echo "Copiando desde: $INDEX_DIR"
          cp -r $INDEX_DIR/* app_temp/www/
          
          # Copia config.xml si existe
          find . -maxdepth 2 -iname "config.xml" -exec cp {} app_temp/ \; || true

      - name: Compilar APK
        run: |
          cd app_temp
          cordova platform add android
          cordova plugin add cordova-plugin-screen-orientation
          cordova build android --debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroOcean-ModernWar-APK
          path: app_temp/platforms/android/app/build/outputs/apk/debug/*.apk
