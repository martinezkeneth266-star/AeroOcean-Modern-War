Name: Compilar APK del Juego

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova
        run: |
          npm install -g cordova

      - name: Crear y compilar proyecto Cordova
        run: |
          # 1. Crear el proyecto temporal
          cordova create temp_app com.guerra.sobreelagua "Guerra Sobre el Agua"
          
          # 2. Limpiar la plantilla www por defecto
          rm -rf temp_app/www/*
          
          # 3. Copiar únicamente los recursos web evitando la carpeta temp_app
          rsync -av --exclude='temp_app' --exclude='.git' --exclude='.github' ./ temp_app/www/
          
          cd temp_app

          # 4. Copiar config.xml personalizado si existe en la raíz
          if [ -f ../config.xml ]; then
            cp ../config.xml .
          fi

          # 5. Agregar plataforma y plugins
          cordova platform add android
          cordova plugin add cordova-plugin-screen-orientation
          
          # 6. Compilar APK en modo Debug para asegurar que se cree el archivo sin pedir firma digital
          cordova build android --debug

      - name: Subir APK compilada como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AeroOcean-ModernWar-APK
          path: "**/*.apk"
